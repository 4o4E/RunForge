name: 容器构建与发布

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

env:
  IMAGE_NAME: ghcr.io/4o4e/runforge
  DOCKER_BUILD_RECORD_UPLOAD: false
  DOCKER_BUILD_SUMMARY: false

jobs:
  build:
    name: 构建、验证并发布容器
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验 tag 和软件包版本
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 生成镜像标签
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=RunForge
            org.opencontainers.image.description=通用 Agent 运行平台
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: 缓存依赖包
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dependency-store
          outputs: type=cacheonly
          cache-from: type=gha,scope=container-package-store
          cache-to: type=gha,scope=container-package-store,mode=max

      - name: 构建 AMD64 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: runforge:ci
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=container-package-store
          provenance: false

      - name: 验证自带和外部 PostgreSQL 部署
        run: bash scripts/verify-container.sh

      - name: 登录 GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 发布已验证的 AMD64 镜像
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            test -n "${tag}" || continue
            docker tag runforge:ci "${tag}"
            docker push "${tag}"
          done <<< "${IMAGE_TAGS}"

      - name: 验证镜像允许匿名拉取
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          docker logout ghcr.io
          docker pull "${IMAGE_NAME}:${GITHUB_REF_NAME}"

      - name: 创建 GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            deploy/compose.postgres.yml \
            deploy/compose.external-postgres.yml \
            deploy/.env.postgres.example \
            deploy/.env.external-postgres.example \
            deploy/security/README.md \
            deploy/security/runforge-bwrap.apparmor \
            deploy/security/runforge-bwrap-seccomp.json \
            --verify-tag \
            --generate-notes \
            --title "RunForge ${GITHUB_REF_NAME}"
