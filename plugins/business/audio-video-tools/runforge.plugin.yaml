schemaVersion: 2
id: audio-video-tools
version: 0.2.0
displayName: 通用音视频文件解析
description: 提供 ffmpeg、ffprobe 和 Speaches 转写，用于各来源音视频文件的通用解析。

skills:
  - id: audio-video-tools
    path: skills/audio-video-tools

executables:
  - name: ffmpeg
    path: bin/linux-amd64/ffmpeg
  - name: ffprobe
    path: bin/linux-amd64/ffprobe

secrets:
  - key: audio-video-tools.speaches-url
    required: true
    description: Speaches 服务地址
  - key: audio-video-tools.speaches-key
    required: true
    description: Speaches 服务访问密钥
mcpServers: []
resources: []
configSchema:
  type: object
