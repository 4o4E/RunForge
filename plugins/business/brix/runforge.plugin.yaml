schemaVersion: 2
id: brix
version: 0.1.0
displayName: Brix 浏览器自动化
description: 通过 Brix 执行通用浏览器操作和受控服务端脚本，Google Lens 是其中一项内置能力。

skills:
  - id: brix-browser
    path: skills/brix-browser

executables: []
secrets:
  - key: brix.base-url
    required: true
    description: Brix HTTP 服务地址，例如 http://brix.ubuntu.lan:9233
  - key: brix.token
    required: true
    description: Brix HTTP Bearer Token
mcpServers: []
resources: []
configSchema:
  type: object
