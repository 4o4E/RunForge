services:
  postgres:
    image: postgres:16
    container_name: runforge-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: runforge
    ports:
      - "5432:5432"
    volumes:
      - runforge-pgdata:/var/lib/postgresql/data

volumes:
  runforge-pgdata:
