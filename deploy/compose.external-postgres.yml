services:
  runforge:
    image: ghcr.io/4o4e/runforge:v0.1.0
    init: true
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:?请设置 DATABASE_URL}
      RUNFORGE_JWT_SECRET: ${RUNFORGE_JWT_SECRET:?请设置 RUNFORGE_JWT_SECRET}
      RUNFORGE_SHARE_SECRET: ${RUNFORGE_SHARE_SECRET:?请设置 RUNFORGE_SHARE_SECRET}
      RUNFORGE_BOOTSTRAP_ADMIN_PASSWORD: ${RUNFORGE_BOOTSTRAP_ADMIN_PASSWORD:?请设置 RUNFORGE_BOOTSTRAP_ADMIN_PASSWORD}
      RUNFORGE_BOOTSTRAP_SYSADMIN_PASSWORD: ${RUNFORGE_BOOTSTRAP_SYSADMIN_PASSWORD:?请设置 RUNFORGE_BOOTSTRAP_SYSADMIN_PASSWORD}
      RUNFORGE_ACCESS_TOKEN: ${RUNFORGE_ACCESS_TOKEN:-}
      LLM_PROVIDER: aisdk
      LLM_AISDK_FLAVOR: openai-compatible
      LLM_REASONING_TAG: think
      LLM_BASE_URL: https://api.openai.com/v1
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: gpt-4o-mini
      LLM_MAX_TOKENS: "4096"
      LLM_TIMEOUT_MS: "120000"
      LLM_MAX_RETRIES: "2"
      LLM_STREAM: "true"
      AGENT_HARD_STEP_CAP: "1000"
      TOOL_SANDBOX: "off"
      TOOL_SANDBOX_BACKEND: auto
      TOOL_NETWORK: disabled
      TOOL_MAX_OUTPUT: "40000"
      OFFICE_PREVIEW_CONVERTER_URL: ""
      OFFICE_PREVIEW_TIMEOUT_MS: "180000"
      OFFICE_PREVIEW_CACHE_VERSION: ""
      OTEL_ENABLED: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_CONSOLE: "false"
      OTEL_SERVICE_NAME: runforge
      WEB_PUSH_VAPID_PUBLIC_KEY: ""
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: mailto:admin@runforge.local
    volumes:
      - runforge-data:/var/lib/runforge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

volumes:
  runforge-data:
