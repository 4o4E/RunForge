services:
  runforge:
    image: ghcr.io/4o4e/runforge:latest
    init: true
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 服务监听地址。容器内固定监听全部网络接口。
      HOST: 0.0.0.0
      # 服务在容器内监听的端口，与上面的容器端口保持一致。
      PORT: "8080"
      # 使用下方 PostgreSQL 服务；密码来自本部署对应的密钥文件。
      DATABASE_URL: postgresql://runforge:${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}@postgres:5432/runforge
      # 租户用户 JWT 的签名密钥。
      RUNFORGE_JWT_SECRET: ${RUNFORGE_JWT_SECRET:?请设置 RUNFORGE_JWT_SECRET}
      # 文件分享链接的签名密钥。
      RUNFORGE_SHARE_SECRET: ${RUNFORGE_SHARE_SECRET:?请设置 RUNFORGE_SHARE_SECRET}
      # 首次启动时创建的 default 租户管理员密码。
      RUNFORGE_BOOTSTRAP_ADMIN_PASSWORD: ${RUNFORGE_BOOTSTRAP_ADMIN_PASSWORD:?请设置 RUNFORGE_BOOTSTRAP_ADMIN_PASSWORD}
      # 首次启动时创建的系统管理员密码。
      RUNFORGE_BOOTSTRAP_SYSADMIN_PASSWORD: ${RUNFORGE_BOOTSTRAP_SYSADMIN_PASSWORD:?请设置 RUNFORGE_BOOTSTRAP_SYSADMIN_PASSWORD}
      # Agent 单次运行的最大步骤数，必须为正整数。
      AGENT_HARD_STEP_CAP: "1000"
      # 工具路径和命令限制。可选值：off、enforce。
      TOOL_SANDBOX: "off"
      # Shell 隔离后端。可选值：auto、none、bwrap。
      TOOL_SANDBOX_BACKEND: auto
      # 工具网络访问。可选值：disabled、enabled。
      TOOL_NETWORK: disabled
      # 单条工具结果的最大字符数，可选范围：1000 至 40000。
      TOOL_MAX_OUTPUT: "40000"
      # Office 转换服务地址；空值关闭 Office 文件预览。
      OFFICE_PREVIEW_CONVERTER_URL: ""
      # Office 转换请求超时时间，单位为毫秒，必须为正整数。
      OFFICE_PREVIEW_TIMEOUT_MS: "180000"
      # Office 预览缓存版本；空值使用默认缓存，修改该值会使旧缓存失效。
      OFFICE_PREVIEW_CACHE_VERSION: ""
    volumes:
      - runforge-data:/var/lib/runforge
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      # 自带数据库的固定用户名。
      POSTGRES_USER: runforge
      # 数据库初始化密码，来自本部署对应的密钥文件。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}
      # 自带数据库的固定数据库名称。
      POSTGRES_DB: runforge
    volumes:
      - runforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runforge -d runforge"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  runforge-data:
  runforge-postgres:
